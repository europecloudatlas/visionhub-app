version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: visionhub-postgres
    environment:
      POSTGRES_DB: visionhub
      POSTGRES_USER: visionhub
      POSTGRES_PASSWORD: visionhub123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionhub"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: visionhub-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
      - ./minio-config:/root/.minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: visionhub-backend
    environment:
      DATABASE_URL: postgresql://visionhub:visionhub123@postgres:5432/visionhub
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: visionhub
      S3_PUBLIC_URL: http://localhost:9000
      JWT_SECRET_KEY: dev-secret-key-change-in-production
      DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: visionhub-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  minio-setup:
    image: minio/mc:latest
    container_name: visionhub-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...';
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'MinIO not ready, retrying...';
        sleep 2;
      done;
      echo 'MinIO is ready!';
      mc mb local/visionhub --ignore-existing;
      mc anonymous set download local/visionhub;
      echo 'MinIO bucket configured!';
      exit 0;
      "    

volumes:
  postgres_data:
  minio_data: