name: Build and Deploy

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

env:
  REGISTRY: registry.nl-01.thalassa.cloud

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'prod' || 'dev' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set environment variables
        id: vars
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "registry_namespace=visionhub-prod" >> $GITHUB_OUTPUT
          else
            echo "environment=dev" >> $GITHUB_OUTPUT
            echo "registry_namespace=visionhub-dev" >> $GITHUB_OUTPUT
          fi
      
      - name: Login to Thalassa Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.THALASSA_REGISTRY_USERNAME }}
          password: ${{ secrets.THALASSA_REGISTRY_PASSWORD }}
      
      - name: Build and push Backend image
        working-directory: ./backend
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ steps.vars.outputs.registry_namespace }}/visionhub-backend:latest .
          docker push ${{ env.REGISTRY }}/${{ steps.vars.outputs.registry_namespace }}/visionhub-backend:latest

      - name: Build and push Frontend image
        working-directory: ./frontend
        run: |
          docker build -t ${{ env.REGISTRY }}/${{ steps.vars.outputs.registry_namespace }}/visionhub-frontend:latest .
          docker push ${{ env.REGISTRY }}/${{ steps.vars.outputs.registry_namespace }}/visionhub-frontend:latest

      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd
      
      - name: Login to ArgoCD
        run: |
          argocd login ${{ secrets.ARGOCD_SERVER }} \
            --username ${{ secrets.ARGOCD_USERNAME }} \
            --password ${{ secrets.ARGOCD_PASSWORD }} \
            --grpc-web
      
      - name: Refresh and Sync Backend application
        run: |
          argocd app get visionhub-backend-${{ steps.vars.outputs.environment }} --hard-refresh
          argocd app sync visionhub-backend-${{ steps.vars.outputs.environment }} --force
      
      - name: Refresh and Sync Frontend application
        run: |
          argocd app get visionhub-frontend-${{ steps.vars.outputs.environment }} --hard-refresh
          argocd app sync visionhub-frontend-${{ steps.vars.outputs.environment }} --force

      - name: Wait for Backend rollout
        run: |
          argocd app wait visionhub-backend-${{ steps.vars.outputs.environment }} --timeout 300
      
      - name: Wait for Frontend rollout
        run: |
          argocd app wait visionhub-frontend-${{ steps.vars.outputs.environment }} --timeout 300